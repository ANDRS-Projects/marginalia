<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #ECEEE7;
    --surface: #F8F9F3;
    --text: #1C1D18;
    --text-muted: #5B5E52;
    --rule: rgba(28,29,24,0.14);
    --accent: #9C6B14;
    --accent-strong: #7A5310;
    --on-accent: #FFFCF5;
    --shadow: rgba(28,29,24,0.08);

    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-note: 'Caveat', 'Segoe Script', cursive;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1C17;
      --surface: #232419;
      --text: #ECEEE4;
      --text-muted: #A7AA9B;
      --rule: rgba(236,238,228,0.16);
      --accent: #D9A63E;
      --accent-strong: #E8B94F;
      --on-accent: #1B1C17;
      --shadow: rgba(0,0,0,0.4);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1B1C17;
    --surface: #232419;
    --text: #ECEEE4;
    --text-muted: #A7AA9B;
    --rule: rgba(236,238,228,0.16);
    --accent: #D9A63E;
    --accent-strong: #E8B94F;
    --on-accent: #1B1C17;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    overflow-x: hidden;
  }

  .canvas {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 4rem 1.5rem 5rem;
    color: var(--text);
    font-family: var(--font-body);
  }

  .welcome {
    max-width: 30rem;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 2.8rem;
    text-align: center;
    align-items: center;
  }

  .eyebrow {
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin: 0;
  }

  .wordmark {
    font-family: var(--font-display);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.9rem);
    line-height: 1.05;
    text-wrap: balance;
    margin: 0;
    color: var(--text);
  }

  .dek {
    max-width: 38ch;
    line-height: 1.55;
    color: var(--text-muted);
    margin: 0.2rem 0 0;
    font-size: 0.98rem;
  }

  .masthead { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
  }

  /* ---- Breathing ---- */
  .breath-wrap {
    position: relative;
    width: 156px;
    height: 156px;
    margin: 0.15rem 0 0.35rem;
  }

  .breath-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    animation: breathe 16s ease-in-out infinite;
  }

  .breath-circle__label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-strong);
    transition: opacity 0.4s ease;
  }

  @keyframes breathe {
    0%   { transform: scale(0.72); }
    25%  { transform: scale(1); }
    50%  { transform: scale(1); }
    75%  { transform: scale(0.72); }
    100% { transform: scale(0.72); }
  }

  @media (prefers-reduced-motion: reduce) {
    .breath-circle { animation: none; transform: scale(0.92); }
  }

  /* ---- Quote ---- */
  .quote {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 3.6vw, 1.45rem);
    line-height: 1.5;
    color: var(--text);
    margin: 0;
    text-wrap: balance;
    transition: opacity 0.35s ease;
  }

  .quote-attribution {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    margin: 0;
    transition: opacity 0.35s ease;
  }

  .quote.fade, .quote-attribution.fade { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .quote, .quote-attribution { transition: none; }
  }

  /* ---- Books ---- */
  .book-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    width: 100%;
    max-width: 25rem;
    text-align: left;
  }

  .book-item {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--rule);
  }

  .book-item:last-child { border-bottom: none; padding-bottom: 0; }

  .book-item__title {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--text);
  }

  .book-item__author {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .ghost-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.32rem 0.65rem;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }

  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Dock tab ---- */
  .dock-tab {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    width: 46px;
    padding: 0.9rem 0.35rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-right: none;
    border-radius: 12px 0 0 12px;
    box-shadow: -2px 2px 10px var(--shadow);
    cursor: pointer;
    font-family: var(--font-mono);
    color: var(--text-muted);
    transition: right .32s cubic-bezier(.16,.84,.44,1), color .15s ease, border-color .15s ease;
  }

  .dock-tab:hover { color: var(--accent); border-color: var(--accent); }
  .dock-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dock-tab__label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.68rem;
  }

  .dock-tab__count {
    background: var(--accent);
    color: var(--on-accent);
    font-size: 0.65rem;
    line-height: 1;
    padding: 0.25rem 0.4rem;
    border-radius: 999px;
    min-width: 1.1rem;
    text-align: center;
  }

  .dock-tab.open { right: min(360px, 88vw); }

  /* ---- Backdrop ---- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.02);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  /* ---- Drawer ---- */
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(360px, 88vw);
    background: var(--bg);
    border-left: 1px solid var(--rule);
    box-shadow: -10px 0 28px var(--shadow);
    z-index: 25;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform .34s cubic-bezier(.16,.84,.44,1);
  }
  .drawer.open { transform: translateX(0); }

  .drawer__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 1.4rem 1.25rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }

  .drawer__heading { display: flex; flex-direction: column; gap: 0.15rem; }

  .drawer__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0;
    color: var(--text);
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }

  .sync-status__dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
  }

  .sync-status[data-synced="true"] .sync-status__dot { background: #4E9A63; }

  .add-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    width: 2rem;
    height: 2rem;
    border-radius: 999px;
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .add-btn:hover { background: var(--accent-strong); }
  .add-btn:active { transform: scale(0.92); }
  .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .drawer__body {
    flex: 1;
    overflow-y: auto;
    padding: 1.1rem 1.1rem 2rem;
  }

  .drawer__empty {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
    padding: 2.5rem 1rem;
    line-height: 1.6;
  }

  /* ---- Notes ---- */
  .note {
    --rot: 0deg;
    --i: 0;
    background: var(--note-color, #FFE58A);
    border-radius: 3px 3px 14px 3px;
    padding: 0.85rem 0.9rem 0.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.14), 0 1px 2px rgba(0,0,0,0.08);
    position: relative;
    transform-origin: top center;
    opacity: 0;
    animation: fan-in .4s cubic-bezier(.2,.9,.35,1) forwards;
    animation-delay: calc(var(--i) * 55ms);
  }

  @keyframes fan-in {
    from { opacity: 0; transform: translateY(16px) rotate(var(--rot)) scale(.94); }
    to { opacity: 1; transform: translateY(0) rotate(var(--rot)) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .note { animation: none; opacity: 1; transform: rotate(var(--rot)); }
    .drawer, .dock-tab, .backdrop { transition: none; }
  }

  .note textarea {
    width: 100%;
    min-height: 84px;
    background: transparent;
    border: none;
    resize: none;
    outline: none;
    font-family: var(--font-note);
    font-weight: 600;
    font-size: 1.3rem;
    line-height: 1.3;
    color: #2A2410;
  }

  .note textarea::placeholder { color: rgba(42,36,16,0.45); }

  .note__delete {
    position: absolute;
    top: 2px;
    right: 4px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: rgba(42,36,16,0.4);
    padding: 0.2rem 0.4rem;
    transition: color .15s ease;
  }
  .note__delete:hover { color: rgba(42,36,16,0.85); }
  .note__delete:focus-visible { outline: 2px solid rgba(42,36,16,0.5); outline-offset: 1px; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* ---- Install banner ---- */
  .install-banner {
    display: none;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem 0.9rem;
    padding: 0.65rem 2.75rem 0.65rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    position: relative;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
  }
  .install-banner.show { display: flex; }

  .install-banner strong { color: var(--text); font-weight: 600; }

  .install-banner__dismiss {
    position: absolute;
    top: 50%;
    right: 0.6rem;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.95rem;
    color: var(--text-muted);
    padding: 0.3rem 0.5rem;
    transition: color .15s ease;
  }
  .install-banner__dismiss:hover { color: var(--accent); }
  .install-banner__dismiss:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

</style>

<script>

    var head = document.head;
    var selectors = [
      'link[rel="apple-touch-icon"]',
      'link[rel="icon"]',
      'link[rel="manifest"]',
      'meta[name="apple-mobile-web-app-capable"]',
      'meta[name="apple-mobile-web-app-title"]',

    ];
    selectors.forEach(function (sel) {

<script id="notes-data" type="application/json">[]</script>

<main class="canvas">

      <p class="dek">A small pause before the busy work. Breathe, sit with a line, and when you're ready, your notes are still there at the edge.</p>
    </div>

      <div class="breath-wrap" aria-live="polite">
        <div class="breath-circle"></div>
        <span class="breath-circle__label" id="breathLabel">Breathe in</span>

</button>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Sticky notes">
  <div class="drawer__header">
    <div class="drawer__heading">
      <h2 class="drawer__title">Marginalia</h2>
      <p class="sync-status" id="syncStatus" data-synced="false"><span class="sync-status__dot"></span><span id="syncStatusLabel">This device only</span></p>
    </div>
    <button class="add-btn" id="addNote" type="button" aria-label="New note">+</button>
  </div>
  <div class="drawer__body" id="notesList"></div>
</aside>

<script>
(function () {
  var STORAGE_KEY = 'marginalia:notes';
  var COLORS = ['#FFE58A', '#FFC1CF', '#B9F3C6', '#BFE1FF', '#FFD9A8', '#E3D1FF'];

  var dockTab = document.getElementById('dockTab');
  var drawer = document.getElementById('drawer');
  var backdrop = document.getElementById('backdrop');
  var addBtn = document.getElementById('addNote');
  var notesList = document.getElementById('notesList');
  var noteCount = document.getElementById('noteCount');
  var syncStatus = document.getElementById('syncStatus');
  var syncStatusLabel = document.getElementById('syncStatusLabel');

  // ---- Storage: localStorage is always the source of truth for this
  // tab/browser. Everything below it is optional and swappable. ----
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveLocal(notes) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch (e) {}
  }

  // ---- Sync adapter -----------------------------------------------
  // A pluggable remote-sync point, not a finished feature. The contract
  // any replacement adapter needs to satisfy:
  //   .init(onReady)   — called once at load. Do whatever setup/auth your
  //                       backend needs, then call onReady() if and only
  //                       if you're able to sync. Never call it otherwise.
  //   .push(notes)     — called after every local edit, passed the full
  //                       current notes array. Persist it to your backend
  //                       however makes sense there. Best-effort/fire-and
  //                       forget is fine — saveLocal() below has already
  //                       run first, so a user's notes are never at risk
  //                       even if this fails.
  //   .active          — boolean flag your init()/push() keep current, so
  //                       the drawer's status pill can reflect it.
  //
  // Want to sync through Notion, your own API, a Gist, Firebase, whatever?
  // Replace the object below with your own implementation of that same
  // three-member shape and the rest of the app needs no changes.
  //
  // The default implementation activates ONLY when this page happens to
  // be running inside Claude's Artifact hosting platform (i.e. `window
  // .claude` exists there) — everywhere else, including GitHub Pages or a
  // locally opened file, `init()` simply never calls `onReady`, and the
  // app runs on localStorage alone.
  var syncAdapter = (function () {
    var artifactApi = null;
    var rawTemplate = null;
    var rawTemplatePromise = null;

    function ensureTemplate() {
      if (rawTemplate) return Promise.resolve(rawTemplate);
      if (!rawTemplatePromise) {
        rawTemplatePromise = fetch(window.location.href, { cache: 'no-store' })
          .then(function (r) { return r.text(); })
          .then(function (text) { rawTemplate = text; return text; })
          .catch(function () { return null; });
      }
      return rawTemplatePromise;
    }

    function buildDocument(notes, template) {
      if (!template) return null;
      var json = JSON.stringify(notes).replace(/</g, '\\u003c');
      var re = /(<script id="notes-data" type="application\/json">)[\s\S]*?(<\/script>)/;
      if (!re.test(template)) return null;
      return template.replace(re, function (_, open, close) { return open + json + close; });
    }

    var adapter = { active: false };

    adapter.init = function (onReady) {
      if (typeof window.claude === 'undefined' || !window.claude.use) return;
      window.claude.use('artifact').then(function (api) {
        if (!api) return;
        artifactApi = api;
        adapter.active = true;
        onReady();
      }, function () {});
    };

    adapter.push = function (notes) {
      if (!artifactApi) return;
      ensureTemplate().then(function (template) {
        var html = buildDocument(notes, template);
        if (!html) return;
        artifactApi.publish(html).then(function () {
          // Success: the shell reloads this view to the new version.
        }, function (err) {
          if (!err || (err.code !== 'conflict' && err.code !== 'rate_limited')) {
            // Anything else (not_writer, not_granted, not_declared, ...):
            // stop trying to sync for the rest of this session.
            artifactApi = null;
            adapter.active = false;
            setSyncStatus(false);
          }
        });
      });
    };

    return adapter;
  })();

  var needsSeed = false;

  function setSyncStatus(synced) {
    syncStatus.dataset.synced = synced ? 'true' : 'false';
    syncStatusLabel.textContent = synced ? 'Synced across devices' : 'This device only';
  }

  function loadInitial() {
    try {
      var tag = document.getElementById('notes-data');
      if (tag && tag.textContent.trim()) {
        var fromDoc = JSON.parse(tag.textContent);
        if (fromDoc && fromDoc.length) return fromDoc;
      }
    } catch (e) {}
    var local = loadLocal();
    if (local.length) needsSeed = true;
    return local;
  }

  function persist(notes) {
    saveLocal(notes);
    syncAdapter.push(notes);
  }

  syncAdapter.init(function () {
    setSyncStatus(true);
    if (needsSeed) persist(notes);
  });

  var notes = loadInitial();

  function randomRot() {
    var deg = (Math.random() * 5) - 2.5;
    return deg.toFixed(2) + 'deg';
  }

  function randomColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  function render() {
    notesList.innerHTML = '';
    noteCount.textContent = notes.length;

    if (!notes.length) {
      var empty = document.createElement('p');
      empty.className = 'drawer__empty';
      empty.textContent = 'No notes yet. Tap + to leave one.';
      notesList.appendChild(empty);
      return;
    }

    notes.forEach(function (note, i) {
      var card = document.createElement('div');
      card.className = 'note';
      card.style.setProperty('--note-color', note.color);
      card.style.setProperty('--rot', note.rot);
      card.style.setProperty('--i', i);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'note__delete';
      del.setAttribute('aria-label', 'Delete note');
      del.textContent = '×';
      del.addEventListener('click', function () {
        notes = notes.filter(function (n) { return n.id !== note.id; });
        persist(notes);
        render();
      });

      var ta = document.createElement('textarea');
      ta.value = note.text;
      ta.placeholder = 'Write something…';
      ta.rows = 1;
      ta.addEventListener('input', function () {
        note.text = ta.value;
        saveLocal(notes);
        autoGrow(ta);
      });
      ta.addEventListener('blur', function () {
        persist(notes);
      });

      card.appendChild(del);
      card.appendChild(ta);
      notesList.appendChild(card);
      autoGrow(ta);
    });
  }

  function openDrawer() {
    drawer.classList.add('open');
    dockTab.classList.add('open');
    backdrop.classList.add('show');
    drawer.setAttribute('aria-hidden', 'false');
    dockTab.setAttribute('aria-expanded', 'true');
  }

  function closeDrawer() {
    if (drawer.contains(document.activeElement)) document.activeElement.blur();
    drawer.classList.remove('open');
    dockTab.classList.remove('open');
    backdrop.classList.remove('show');
    drawer.setAttribute('aria-hidden', 'true');
    dockTab.setAttribute('aria-expanded', 'false');
  }

  function toggleDrawer() {
    if (drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  }

  dockTab.addEventListener('click', toggleDrawer);
  backdrop.addEventListener('click', closeDrawer);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  addBtn.addEventListener('click', function () {
    var note = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      text: '',
      color: randomColor(),
      rot: randomRot()
    };
    notes.unshift(note);
    // Save locally right away, but don't trigger a network publish yet —
    // publish() reloads this view, and doing that the instant the note is
    // created interrupts the viewer as they tap in to start typing. The
    // textarea's own 'blur' handler covers the real sync once they're done.
    saveLocal(notes);
    render();
    if (!drawer.classList.contains('open')) openDrawer();
    requestAnimationFrame(function () {
      var first = notesList.querySelector('.note textarea');
      if (first) first.focus();
    });
  });

  render();
})();

(function () {
  // ---- Breathing ----
  var PHASES = ['Breathe in', 'Hold', 'Breathe out', 'Hold'];
  var breathLabel = document.getElementById('breathLabel');
  var phaseIndex = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function cyclePhase() {
    phaseIndex = (phaseIndex + 1) % PHASES.length;
    if (reduceMotion) {
      breathLabel.textContent = PHASES[phaseIndex];
      return;
    }
    breathLabel.style.opacity = 0;
    setTimeout(function () {
      breathLabel.textContent = PHASES[phaseIndex];
      breathLabel.style.opacity = 1;
    }, 250);
  }
  setInterval(cyclePhase, 4000);

  // ---- Quotes ----
  var QUOTES = [
    { text: "Tell me, what is it you plan to do with your one wild and precious life?", author: "Mary Oliver" },
    { text: "You have power over your mind, not outside events. Realize this, and you will find strength.", author: "Marcus Aurelius" },
    { text: "The quieter you become, the more you can hear.", author: "Ram Dass" },
    { text: "Nature does not hurry, yet everything is accomplished.", author: "Lao Tzu" },
    { text: "Almost everything will work again if you unplug it for a few minutes, including you.", author: "Anne Lamott" },
    { text: "Sit in a room and read — and read and read. And read the right books by the right people.", author: "Ray Bradbury" },
    { text: "Wherever you are, be all there.", author: "Jim Elliot" },
    { text: "The present moment is the only time over which we have dominion.", author: "Thích Nhất Hạnh" },
    { text: "Rest is not idleness.", author: "John Lubbock" },
    { text: "What we plant in the soil of contemplation, we shall reap in the harvest of action.", author: "Meister Eckhart" },
    { text: "It's not that I'm so smart. I stay with problems longer.", author: "Albert Einstein" },
    { text: "Slow down and everything you are chasing will come around and catch you.", author: "John De Paola" },
    { text: "Simplicity, patience, compassion.", author: "Lao Tzu" },
    { text: "The soul usually knows what to do to heal itself. The challenge is to silence the mind.", author: "Caroline Myss" }
  ];

  var quoteText = document.getElementById('quoteText');
  var quoteAttribution = document.getElementById('quoteAttribution');
  var nextQuoteBtn = document.getElementById('nextQuote');
  var quoteIndex = Math.floor(Math.random() * QUOTES.length);
  var quoteTimer = null;

  function paintQuote() {
    var q = QUOTES[quoteIndex];
    quoteText.textContent = '“' + q.text + '”';
    quoteAttribution.textContent = '— ' + q.author;
  }

  function showQuote(next) {
    if (next) quoteIndex = (quoteIndex + 1) % QUOTES.length;
    if (reduceMotion) { paintQuote(); return; }
    quoteText.classList.add('fade');
    quoteAttribution.classList.add('fade');
    setTimeout(function () {
      paintQuote();
      quoteText.classList.remove('fade');
      quoteAttribution.classList.remove('fade');
    }, 300);
  }

  function resetQuoteTimer() {
    clearInterval(quoteTimer);
    quoteTimer = setInterval(function () { showQuote(true); }, 20000);
  }

  paintQuote();
  resetQuoteTimer();

  nextQuoteBtn.addEventListener('click', function () {
    showQuote(true);
    resetQuoteTimer();
  });

  // ---- Books ----
  var BOOKS = [
    { title: 'Four Thousand Weeks', author: 'Oliver Burkeman' },
    { title: 'How to Do Nothing', author: 'Jenny Odell' },
    { title: 'The Art of Stillness', author: 'Pico Iyer' },
    { title: 'Wintering', author: 'Katherine May' },
    { title: 'Braiding Sweetgrass', author: 'Robin Wall Kimmerer' },
    { title: 'Rest Is Resistance', author: 'Tricia Hersey' },
    { title: 'A Book of Silence', author: 'Sara Maitland' },
    { title: 'The Art of the Wasted Day', author: 'Patricia Hampl' },
    { title: 'Meditations', author: 'Marcus Aurelius' },
    { title: 'Quiet', author: 'Susan Cain' },
    { title: 'The Little Book of Hygge', author: 'Meik Wiking' }
  ];

  var bookList = document.getElementById('bookList');
  var shuffleBtn = document.getElementById('shuffleBooks');

  function pickBooks(n) {
    var pool = BOOKS.slice();
    var picked = [];
    while (picked.length < n && pool.length) {
      var i = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(i, 1)[0]);
    }
    return picked;
  }

  function renderBooks() {
    bookList.innerHTML = '';
    pickBooks(3).forEach(function (book) {
      var li = document.createElement('li');
      li.className = 'book-item';

      var title = document.createElement('span');
      title.className = 'book-item__title';
      title.textContent = book.title;

      var author = document.createElement('span');
      author.className = 'book-item__author';
      author.textContent = book.author;

      li.appendChild(title);
      li.appendChild(author);
      bookList.appendChild(li);
    });
  }

  shuffleBtn.addEventListener('click', renderBooks);
  renderBooks();
})();
(function () {
  // ---- Install banner (Safari has no native install prompt; this is a
  // page-drawn substitute, shown once until dismissed). ----
  var DISMISS_KEY = 'marginalia:installBannerDismissed';
  var banner = document.getElementById('installBanner');
  var textEl = document.getElementById('installBannerText');
  var dismissBtn = document.getElementById('installBannerDismiss');

  function alreadyInstalled() {
    try {
      if (window.navigator.standalone) return true;
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    } catch (e) {}
    return false;
  }

  function dismissed() {
    try { return localStorage.getItem(DISMISS_KEY) === 'true'; } catch (e) { return false; }
  }

  function setDismissed() {
    try { localStorage.setItem(DISMISS_KEY, 'true'); } catch (e) {}
  }

  dismissBtn.addEventListener('click', function () {
    setDismissed();
    banner.classList.remove('show');
  });

  try {
    if (alreadyInstalled() || dismissed()) return;

    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
    var isMac = /Macintosh/.test(ua) && !isIOS;

    if (isIOS && isSafari) {
      textEl.innerHTML = 'Add <strong>Marginalia</strong> to your Home Screen — tap Share, then "Add to Home Screen".';
    } else if (isMac && isSafari) {
      textEl.innerHTML = 'Add <strong>Marginalia</strong> to your Dock — File \u2192 "Add to Dock".';
    } else {
      return;
    }

    banner.classList.add('show');
  } catch (e) {}
})();
</script>
